<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 391" width="960" height="391"><rect width="960" height="391" style="fill:var(--surface)"/><text xml:space="preserve" x="10" y="22" font-family="var(--mono)" font-size="13" font-weight="bold" text-anchor="start" style="fill:var(--fg)">On 64-bit Python a returned pointer keeps only its low 32 bits: handles and API addresses are corrupted</text><rect x="10" y="34" width="940" height="214" rx="4" style="fill:var(--tint);stroke:var(--rule)"/><text xml:space="preserve" x="20" y="54" font-family="var(--mono)" font-size="12" font-weight="bold" text-anchor="start" style="fill:var(--muted)">stage 3 resolve_api(): no restype on GetModuleHandleW / GetProcAddress</text><text xml:space="preserve" x="20" y="72" font-family="var(--mono)" font-size="10.5" font-weight="normal" text-anchor="start" style="fill:var(--fg)">   69  def resolve_api(lib_name, api_name):</text><text xml:space="preserve" x="20" y="87" font-family="var(--mono)" font-size="10.5" font-weight="normal" text-anchor="start" style="fill:var(--fg)">   70      """Phase VI: Dynamic API Resolution to bypass IAT analysis"""</text><text xml:space="preserve" x="20" y="102" font-family="var(--mono)" font-size="10.5" font-weight="normal" text-anchor="start" style="fill:var(--fg)">   71      if os.name != 'nt': return None</text><text xml:space="preserve" x="20" y="117" font-family="var(--mono)" font-size="10.5" font-weight="normal" text-anchor="start" style="fill:var(--fg)">   72      try:</text><text xml:space="preserve" x="20" y="132" font-family="var(--mono)" font-size="10.5" font-weight="normal" text-anchor="start" style="fill:var(--fg)">   73          kernel32 = ctypes.windll.kernel32</text><rect x="14" y="135" width="932" height="15" style="fill:var(--alert);fill-opacity:0.14"/><text xml:space="preserve" x="20" y="147" font-family="var(--mono)" font-size="10.5" font-weight="normal" text-anchor="start" style="fill:var(--alert)">   74          h_mod = kernel32.GetModuleHandleW(lib_name)</text><text xml:space="preserve" x="20" y="162" font-family="var(--mono)" font-size="10.5" font-weight="normal" text-anchor="start" style="fill:var(--fg)">   75          if not h_mod: </text><rect x="14" y="165" width="932" height="15" style="fill:var(--alert);fill-opacity:0.14"/><text xml:space="preserve" x="20" y="177" font-family="var(--mono)" font-size="10.5" font-weight="normal" text-anchor="start" style="fill:var(--alert)">   76              h_mod = kernel32.LoadLibraryW(lib_name)</text><rect x="14" y="180" width="932" height="15" style="fill:var(--alert);fill-opacity:0.14"/><text xml:space="preserve" x="20" y="192" font-family="var(--mono)" font-size="10.5" font-weight="normal" text-anchor="start" style="fill:var(--alert)">   77          addr = kernel32.GetProcAddress(h_mod, api_name.encode() if isinstance(api_name, str) else api_name)</text><text xml:space="preserve" x="20" y="207" font-family="var(--mono)" font-size="10.5" font-weight="normal" text-anchor="start" style="fill:var(--fg)">   78          if not addr: return None</text><text xml:space="preserve" x="20" y="222" font-family="var(--mono)" font-size="10.5" font-weight="normal" text-anchor="start" style="fill:var(--fg)">   79          return addr</text><text xml:space="preserve" x="20" y="237" font-family="var(--mono)" font-size="10.5" font-weight="normal" text-anchor="start" style="fill:var(--fg)">   80      except: return None</text><rect x="10" y="258" width="940" height="94" rx="4" style="fill:var(--tint);stroke:var(--rule)"/><text xml:space="preserve" x="20" y="278" font-family="var(--mono)" font-size="12" font-weight="bold" text-anchor="start" style="fill:var(--muted)">harness (no sample code): the same default restype on a 64-bit Python</text><text xml:space="preserve" x="20" y="296" font-family="var(--mono)" font-size="10.5" font-weight="normal" text-anchor="start" style="fill:var(--fg)">python 3.14.4 x86_64 pointer size 64-bit</text><rect x="14" y="299" width="932" height="15" style="fill:var(--alert);fill-opacity:0.14"/><text xml:space="preserve" x="20" y="311" font-family="var(--mono)" font-size="10.5" font-weight="normal" text-anchor="start" style="fill:var(--alert)">dlsym('printf') with default restype : -0x1f19bf80</text><text xml:space="preserve" x="20" y="326" font-family="var(--mono)" font-size="10.5" font-weight="normal" text-anchor="start" style="fill:var(--fg)">dlsym('printf') with restype=c_void_p: 0x74a8e0e64080</text><rect x="14" y="329" width="932" height="15" style="fill:var(--alert);fill-opacity:0.14"/><text xml:space="preserve" x="20" y="341" font-family="var(--mono)" font-size="10.5" font-weight="normal" text-anchor="start" style="fill:var(--alert)">truncated to low 32 bits (sign-extended): True, equal: False</text><text xml:space="preserve" x="10" y="370" font-family="var(--mono)" font-size="11" font-weight="normal" text-anchor="start" style="fill:var(--muted)">Stage 2 installs the amd64 Python embed whenever IsWow64Process is true, i.e. on every 64-bit Windows.</text></svg>
